[project]
name = "flow-social-api"
version = "0.1.0"
description = "API en worker voor de Flow Social Generator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "pillow>=11.0",
    "pillow-heif>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET"]

[tool.pytest.ini_options]
testpaths = ["tests"]
