# Projectaankondiging: projectbeeld met tekst onderin en het logo van de afzender.
# Gebaseerd op de spec; nog gelijktrekken met het prototype zodra dat beschikbaar is.
key: project_announcement
name: Projectaankondiging
type: project_announcement
version: 1
description: Kondig een project aan met een projectbeeld, titel en klant- of projectnaam.
fields:
  - key: background_image
    label: Projectbeeld
    type: image
    required: true
    help: Een still uit het project. Liefst minstens 1920 px breed.
  - key: label
    label: Label
    type: select
    options: [Nieuw project, Net opgeleverd, Nu te zien, Behind the scenes]
  - key: headline
    label: Titel
    type: text
    required: true
    maxLength: 70
  - key: client_or_project_name
    label: Klant of project in beeld
    type: text
    required: true
    maxLength: 40
  - key: note
    label: Extra notitie
    type: longtext
    maxLength: 140
    help: Wordt niet getoond op liggende formaten.

layers:
  - id: photo
    type: background
    source: upload
    field: background_image
    z: 0
    editable: true
    layouts:
      default:
        box: { anchor: top-left, width: 100, height: 100, bleed: true }
        fit: cover
        focus: { x: 0.5, y: 0.5 }

  - id: scrim
    type: shape
    source: static
    z: 10
    shapeStyle:
      gradient: { fromColor: "#000000", toColor: "#000000", fromOpacity: 0, toOpacity: 0.85, angle: 180 }
    layouts:
      default:
        box: { anchor: bottom-left, width: 100, height: 70, bleed: true }
      tall:
        box: { anchor: bottom-left, width: 100, height: 80, bleed: true }
      landscape:
        box: { anchor: top-left, width: 100, height: 100, bleed: true }

  - id: logo
    type: logo
    source: brand_asset
    brandAsset: logo_light
    z: 20
    layouts:
      default:
        box: { anchor: top-left, width: 28, height: 9 }
        fit: contain
        focus: { x: 0, y: 0 }
      landscape:
        box: { anchor: top-left, width: 20, height: 12 }

  - id: label
    type: text
    source: content_field
    field: label
    z: 30
    textStyle: { font: heading, weight: 700, color: accent, uppercase: true, letterSpacing: 0.08, lineHeight: 1.1 }
    layouts:
      default:
        box: { anchor: bottom-left, y: 48, width: 100, height: 5 }
        minFontSize: 22
        maxFontSize: 30
        maxLines: 1
        verticalAlign: bottom
      landscape:
        box: { anchor: bottom-left, y: 62, width: 60, height: 8 }
        minFontSize: 18
        maxFontSize: 24

  - id: headline
    type: text
    source: content_field
    field: headline
    z: 30
    textStyle: { font: heading, weight: 700, color: text_on_dark, lineHeight: 1.05 }
    layouts:
      default:
        box: { anchor: bottom-left, y: 21, width: 100, height: 26 }
        minFontSize: 44
        maxFontSize: 88
        maxLines: 3
        verticalAlign: bottom
      landscape:
        box: { anchor: bottom-left, y: 13, width: 62, height: 48 }
        minFontSize: 32
        maxFontSize: 60
        maxLines: 3

  - id: client_name
    type: text
    source: content_field
    field: client_or_project_name
    z: 30
    textStyle: { font: body, weight: 500, color: secondary, lineHeight: 1.1 }
    layouts:
      default:
        box: { anchor: bottom-left, y: 13, width: 100, height: 7 }
        minFontSize: 26
        maxFontSize: 40
        maxLines: 1
        verticalAlign: bottom
      landscape:
        box: { anchor: bottom-left, y: 0, width: 62, height: 11 }
        minFontSize: 22
        maxFontSize: 32

  - id: note
    type: text
    source: content_field
    field: note
    z: 30
    textStyle: { font: body, weight: 400, color: text_on_dark, lineHeight: 1.3 }
    layouts:
      default:
        box: { anchor: bottom-left, y: 0, width: 90, height: 12 }
        minFontSize: 22
        maxFontSize: 30
        maxLines: 3
      landscape:
        hidden: true
